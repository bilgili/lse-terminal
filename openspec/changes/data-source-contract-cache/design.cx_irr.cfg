\* D7.3 as written on an off-grid session-open bar, cap 1 forces truncation.
SPECIFICATION Spec
CONSTANTS
    Keys = {"A", "B"}
    Readers = {r1, r2}
    NoOne = NoOne
    Step = 2
    Settle = 1
    MaxTime = 8
    Cap = 1
    SrcBars <- BarsIrr
    Windows <- Win8
    Limits = {2, 4}
    Kinds = {"win", "lim"}
    Lag = 0
    RestateOn = FALSE
    TransientOn = FALSE
    SkipOn = FALSE
    ClearOn = FALSE
    FixEdge = TRUE
    FixTail = TRUE
    FixTrunc = FALSE
    FixCount = TRUE
    FixExtend = TRUE
    FixLock = TRUE
SYMMETRY Perms
INVARIANTS I2
