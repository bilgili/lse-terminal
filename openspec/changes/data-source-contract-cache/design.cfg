\* Main run: D7 with the five amendments of design-review.md, no source faults.
\* Step = 1 (settle = step: the 1s and 1m case). 2 keys, 2 readers, cap 3.
SPECIFICATION Spec
CONSTANTS
    Keys = {"A", "B"}
    Readers = {r1, r2}
    NoOne = NoOne
    Step = 1
    Settle = 1
    MaxTime = 8
    Cap = 3
    SrcBars <- Bars1
    Windows <- Win8
    Limits = {2, 4}
    Kinds = {"win", "lim"}
    Lag = 0
    RestateOn = FALSE
    TransientOn = FALSE
    SkipOn = FALSE
    ClearOn = TRUE
    FixEdge = TRUE
    FixTail = TRUE
    FixTrunc = TRUE
    FixCount = TRUE
    FixExtend = TRUE
    FixLock = TRUE
SYMMETRY Perms
INVARIANTS I1 I2 CovBehindSource I3
