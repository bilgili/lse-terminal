    FixTail = TRUE
    FixTrunc = TRUE
    FixCount = TRUE
    FixExtend = TRUE
    FixLock = TRUE
    PlanWin = TRUE
    PlanLimTail = FALSE
    PlanMissAsIs = TRUE
    ExtOnePage = TRUE
    FixHit = TRUE
