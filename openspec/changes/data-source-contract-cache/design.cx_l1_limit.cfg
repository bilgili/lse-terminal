\* L1 under fairness, implemented rules, 1 reader, limit 4 < the 7 bars of key A
\* in [0, 8): the paging stop leaves ticks uncovered. Must violate L1.
SPECIFICATION FairSpec
CONSTANTS
    Keys = {"A"}
    Readers = {r1}
    NoOne = NoOne
    Step = 1
    Settle = 1
    MaxTime = 8
    Cap = 3
    SrcBars <- Bars1
    Windows <- WinFull
    Limits = {4}
    Kinds = {"win"}
    Lag = 0
    RestateOn = FALSE
    TransientOn = FALSE
    SkipOn = FALSE
    ClearOn = FALSE
    FixEdge = TRUE
    FixTail = TRUE
    FixTrunc = TRUE
    FixCount = TRUE
    FixExtend = TRUE
    FixLock = TRUE
    PlanWin = TRUE
    PlanLimTail = FALSE
    PlanMissAsIs = TRUE
    ExtOnePage = TRUE
    FixHit = TRUE
    TailFromRun = TRUE
PROPERTIES L1
