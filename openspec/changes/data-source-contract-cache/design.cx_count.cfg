\* D7.4 as written: store hit counts every stored bar of the key.
SPECIFICATION Spec
CONSTANTS
    Keys = {"A", "B"}
    Readers = {r1, r2}
    NoOne = NoOne
    Step = 1
    Settle = 1
    MaxTime = 8
    Cap = 3
    SrcBars <- Bars1
    Windows <- Win8
    Limits = {2, 4}
    Kinds = {"win", "lim"}
    Lag = 0
    RestateOn = FALSE
    TransientOn = FALSE
    SkipOn = FALSE
    ClearOn = FALSE
    FixEdge = TRUE
    FixTail = TRUE
    FixTrunc = TRUE
    FixCount = FALSE
    FixExtend = FALSE
    FixLock = TRUE
SYMMETRY Perms
INVARIANTS I3
